services:
  mon_projet:
    build: .
    container_name: conso
    restart: unless-stopped
    ports:
      - "5011:5011"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Paris
    user: "1000:1000"  # Force le conteneur à tourner sous l'UID 1000 et GID 1000