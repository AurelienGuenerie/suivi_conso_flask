services:
  mon_projet:
    build: .
    container_name: conso
    restart: unless-stopped
    ports:
      - 127.0.0.1:5011:5011 # <--- Seul SWAG (qui est sur le host) pourra le voir
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Paris
    user: "1000:100"  # Force le conteneur à tourner sous l'UID 1000 et GID 100
    command: 
          - gunicorn
          - --workers
          - "1"
          - --access-logfile
          - "-"
          - --error-logfile
          - "-"
          - --bind
          - "0.0.0.0:5011"
          - app:create_app()
